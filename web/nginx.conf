server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: every unknown path is the app shell.
  location / { try_files $uri $uri/ /index.html; }

  # The service worker must never be served stale, or an update never lands.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location /api/ { proxy_pass http://api:4000/; proxy_set_header Host $host; }
  location /uploads/ { proxy_pass http://api:4000/uploads/; }
}
