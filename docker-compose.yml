services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
      POSTGRES_DB: aura
    volumes: [aura-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura"]
      interval: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://aura:aura@db:5432/aura?schema=public
      JWT_SECRET: change-me-before-any-real-deployment
      PORT: "4000"
      UPLOAD_DIR: /data/uploads
      DEV_OTP: "1234"
      SEED_IF_EMPTY: "1"
    volumes: [aura-uploads:/data/uploads]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./web
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  aura-db:
  aura-uploads:
